<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nexus">
  <title>Nexus</title>
  <!-- A junction: one stem in at the bottom, fanning out to providers.
       Node angles are 90 / -30 / -150 about the hub, which sits at cy = 256 -
       R/4 so the uneven triradiate mass still optically centres.
       Colours track assets/brand/tokens.css - keep them in step. -->
  <defs>
    <linearGradient id="nx-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#151A22"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>
    <!-- userSpaceOnUse, not the default objectBoundingBox: the vertical stem
         has a zero-width bbox, and an objectBoundingBox gradient on a
         degenerate box is undefined - renderers drop the path. It also makes
         the gradient one sweep across the whole mark instead of restarting
         per element. -->
    <linearGradient id="nx-mark" gradientUnits="userSpaceOnUse"
                    x1="120" y1="130" x2="392" y2="382">
      <stop offset="0" stop-color="#6FB4FF"/>
      <stop offset="1" stop-color="#3B8EF0"/>
    </linearGradient>
    <radialGradient id="nx-glow" cx="0.5" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#3B8EF0" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3B8EF0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3B8EF0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#nx-bg)"/>
  <circle cx="256" cy="240" r="196" fill="url(#nx-glow)"/>
  <!-- hairline echoing the HUD card edge -->
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#232833" stroke-width="6"/>

  <g stroke="url(#nx-mark)" stroke-width="27" stroke-linecap="round" fill="none">
    <path d="M256 223 L256 355"/>
    <path d="M256 223 L370.3 157"/>
    <path d="M256 223 L141.7 157"/>
  </g>

  <g fill="url(#nx-mark)">
    <circle cx="256" cy="355" r="38"/>
    <circle cx="370.3" cy="157" r="38"/>
    <circle cx="141.7" cy="157" r="38"/>
    <circle cx="256" cy="223" r="58"/>
  </g>
</svg>
