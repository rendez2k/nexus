name: Build Windows tray

# Produces the Nexus tray executable for Windows.
#
# `workflow_dispatch` is the point of this workflow: CI only runs on the
# default branch and pull requests, so this is how you get an .exe out of a
# feature branch. Actions tab -> "Build Windows tray" -> Run workflow -> pick
# the branch. The binary lands as a downloadable artifact on the run.

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  # write, not read: the last step publishes the executable to the rolling
  # `tray-latest` prerelease so scripts/windows/nexus-tray.ps1 can fetch it
  # over a plain URL. Actions artifacts need an authenticated request, which
  # would mean putting a token in the updater script.
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      # Cold Tauri builds compile the whole dependency tree and take 10-20
      # minutes; cached ones are a fraction of that.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci --prefix apps/desktop
      # build:binary is `tauri build --no-bundle`: it emits the bare
      # executable and skips the MSI/NSIS installers. That is deliberate - the
      # router locates the tray by this exact path (src/install-plan.mjs), and
      # docs/DESKTOP-TRAY.md tells you to launch it directly. Swap to
      # `npm run build --prefix apps/desktop` if you ever want the installers.
      - run: npm run build:binary --prefix apps/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-tray-windows-x64
          # Named for the Cargo [[bin]], which is still codex-router-desktop -
          # renaming it would break the router's tray lookup. See docs/RENAME.md.
          path: apps/desktop/src-tauri/target/release/codex-router-desktop.exe
          if-no-files-found: error

      # A single rolling prerelease, replaced in place on every run, rather
      # than a release per build. The tag stays put so the updater script can
      # hard-code one URL. Skipped on pull requests.
      - name: Publish to the rolling tray-latest release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=apps/desktop/src-tauri/target/release/codex-router-desktop.exe
          sha256sum "$exe" | awk '{print $1}' > codex-router-desktop.exe.sha256
          notes="Rolling build of the Windows tray.

          Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA}\`, run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Replaced on every build. Unsigned, so SmartScreen will warn on first run.
          \`scripts/windows/nexus-tray.ps1\` downloads from here."
          gh release view tray-latest >/dev/null 2>&1 || gh release create tray-latest \
            --prerelease --title "Nexus tray (latest build)" --notes "$notes" --target "$GITHUB_SHA"
          gh release upload tray-latest "$exe" codex-router-desktop.exe.sha256 --clobber
          gh release edit tray-latest --notes "$notes"
